<!DOCTYPE html>
<html lang="pl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peritti – Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; }
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="absolute top-4 right-4 flex gap-2 z-10">
        <button onclick="setLang('pl')" class="w-8 h-8 rounded-full overflow-hidden border border-zinc-700 hover:scale-110 transition shadow-lg">
            <img src="./assets/pl.png" alt="PL" class="w-full h-full object-cover">
        </button>
        <button onclick="setLang('en')" class="w-8 h-8 rounded-full overflow-hidden border border-zinc-700 hover:scale-110 transition shadow-lg">
            <img src="./assets/uk.png" alt="EN" class="w-full h-full object-cover">
        </button>
    </div>

    <div class="max-w-md w-full bg-zinc-900/80 backdrop-blur-md border border-zinc-800 rounded-2xl p-6 shadow-2xl transition-all duration-300 hover:border-zinc-700">
        
        <div class="text-center mb-6">
            <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-emerald-500/50 mx-auto mb-4 shadow-lg shadow-emerald-500/10">
                <img src="./assets/avatar.jpeg" alt="Peritti" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wider">Peritti</h1>
            <p id="txtRole" class="text-xs text-emerald-400 mt-1 font-semibold uppercase tracking-widest">Programista & Inżynier Elektryk</p>
            <p id="txtDesc" class="text-sm text-zinc-400 mt-2">Tworzę systemy i koduję. Po godzinach gracz Minecraft Crystal PvP (HT3).</p>
        </div>

        <div class="mb-6 space-y-2">
            <div class="flex items-center justify-between p-3 bg-zinc-800/40 border border-zinc-800 rounded-xl text-sm">
                <span id="txtMcLabel" class="text-zinc-400">Minecraft PvP</span>
                <span class="text-emerald-400 font-bold">HT3 Crystal PvP</span>
            </div>
            <div class="flex items-center justify-between p-3 bg-zinc-800/40 border border-zinc-800 rounded-xl text-sm">
                <span class="text-zinc-400">Discord</span>
                <span class="text-zinc-200 font-mono">peritti28</span>
            </div>
        </div>

        <div class="space-y-3">
            <a href="https://github.com/peritti7" target="_blank" class="flex items-center justify-between p-3.5 bg-zinc-800/50 hover:bg-zinc-800 border border-zinc-700/50 hover:border-emerald-500/50 rounded-xl transition-all duration-300 group shadow-md">
                <span class="font-medium text-zinc-200 group-hover:text-emerald-400 transition-colors">GitHub</span>
                <span class="text-xs text-zinc-400 group-hover:translate-x-1 transition-transform">@peritti7 &rarr;</span>
            </a>

            <div class="flex items-center justify-between p-3.5 bg-zinc-800/50 border border-zinc-700/50 rounded-xl text-sm">
                <span class="font-medium text-zinc-200">Discord Contact</span>
                <span class="text-xs text-zinc-400">peritti28</span>
            </div>
        </div>

        <div class="text-center mt-6 pt-4 border-t border-zinc-800/80 text-xs text-zinc-500">
            Cloudflare Pages &bull; js.org
        </div>

    </div>

    <script>
        const translations = {
            pl: {
                role: "Programista & Inżynier Elektryk",
                desc: "Tworzę systemy i koduję. Po godzinach gracz Minecraft Crystal PvP (HT3).",
                mc: "Minecraft PvP"
            },
            en: {
                role: "Developer & Electrical Engineer",
                desc: "Building systems and writing code. After hours Minecraft Crystal PvP player (HT3).",
                mc: "Minecraft PvP"
            }
        };

        function setLang(lang) {
            document.getElementById('htmlRoot').lang = lang;
            document.getElementById('txtRole').innerText = translations[lang].role;
            document.getElementById('txtDesc').innerText = translations[lang].desc;
            document.getElementById('txtMcLabel').innerText = translations[lang].mc;
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.05)';

            particles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
