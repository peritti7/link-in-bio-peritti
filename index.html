<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peritti | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .glass-card {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <canvas id="bg-canvas"></canvas>

    <div class="absolute top-6 right-6 z-20 flex items-center gap-2 bg-zinc-900/80 border border-zinc-800 p-1.5 rounded-full shadow-lg backdrop-blur-md">
        <button onclick="setLanguage('pl')" id="btn-pl" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition bg-blue-600 text-white shadow-sm">
            <img src="pl.png" alt="PL" class="w-4 h-4 rounded-full object-cover"> PL
        </button>
        <button onclick="setLanguage('en')" id="btn-en" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition text-zinc-400 hover:text-white">
            <img src="uk.png" alt="EN" class="w-4 h-4 rounded-full object-cover"> EN
        </button>
    </div>

    <div class="max-w-md w-full glass-card rounded-3xl p-8 shadow-2xl relative z-10 my-12">
        
        <div class="text-center mb-8">
            <div class="relative w-28 h-28 mx-auto mb-5 group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full blur opacity-50 group-hover:opacity-100 transition duration-500"></div>
                <img src="avatar.jpeg" alt="Avatar" class="relative w-28 h-28 rounded-full object-cover border-2 border-zinc-800 shadow-inner">
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">peritti</h1>
            <p class="text-xs font-medium text-blue-400 mt-1 uppercase tracking-widest" data-translate="role">Programista & Elektryk Inżynier</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-zinc-900/60 border border-zinc-800/80 p-3.5 rounded-2xl text-center">
                <span class="block text-[10px] uppercase font-bold text-zinc-500 tracking-wider mb-1" data-translate="skill1_title">Minecraft</span>
                <span class="text-sm font-semibold text-zinc-200">HT3 Crystal PvP</span>
            </div>
            <div class="bg-zinc-900/60 border border-zinc-800/80 p-3.5 rounded-2xl text-center">
                <span class="block text-[10px] uppercase font-bold text-zinc-500 tracking-wider mb-1" data-translate="skill2_title">Discord</span>
                <span id="discord-tag" class="text-sm font-semibold text-blue-400 cursor-pointer hover:underline" onclick="copyDiscord()">peritti28</span>
            </div>
        </div>

        <div class="space-y-3">
            <a href="https://github.com/peritti7" target="_blank" class="btn-hover flex items-center justify-between p-4 bg-zinc-900/60 border border-zinc-800 rounded-2xl text-sm font-medium">
                <span class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-zinc-400" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                    GitHub
                </span>
                <span class="text-xs text-zinc-500 font-mono">peritti7 &rarr;</span>
            </a>
        </div>

        <div class="text-center mt-8 pt-4 border-t border-zinc-800/60 text-xs text-zinc-500 font-mono">
            Cloudflare Pages &bull; js.org
        </div>

    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let count = (canvas.width * canvas.height) / 12000;
            for (let i = 0; i < count; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.1 * (1 - distance / 100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function copyDiscord() {
            navigator.clipboard.writeText("peritti28");
            const tag = document.getElementById('discord-tag');
            const originalText = tag.innerText;
            tag.innerText = currentLang === 'pl' ? "Skopiowano!" : "Copied!";
            setTimeout(() => {
                tag.innerText = originalText;
            }, 1500);
        }

        const translations = {
            pl: {
                role: "Programista & Elektryk Inżynier",
                skill1_title: "Minecraft",
                skill2_title: "Discord"
            },
            en: {
                role: "Developer & Electrical Engineer",
                skill1_title: "Minecraft",
                skill2_title: "Discord"
            }
        };

        let currentLang = 'pl';

        function setLanguage(lang) {
            currentLang = lang;
            const btnPl = document.getElementById('btn-pl');
            const btnEn = document.getElementById('btn-en');
            
            if (lang === 'pl') {
                btnPl.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition bg-blue-600 text-white shadow-sm";
                btnEn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition text-zinc-400 hover:text-white";
            } else {
                btnEn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition bg-blue-600 text-white shadow-sm";
                btnPl.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition text-zinc-400 hover:text-white";
            }

            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>
