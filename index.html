<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peritti28 | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            overflow-x: hidden;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .glass-card {
            background: rgba(24, 24, 27, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <canvas id="bg-canvas"></canvas>

    <div class="absolute top-6 right-6 z-20 flex gap-2">
        <button onclick="setLang('pl')" id="btn-pl" class="w-9 h-9 rounded-full overflow-hidden border-2 border-emerald-500 transition shadow-lg focus:outline-none">
            <img src="assets/pl.png" alt="PL" class="w-full h-full object-cover">
        </button>
        <button onclick="setLang('en')" id="btn-en" class="w-9 h-9 rounded-full overflow-hidden border-2 border-zinc-700 opacity-60 hover:opacity-100 transition shadow-lg focus:outline-none">
            <img src="assets/uk.png" alt="EN" class="w-full h-full object-cover">
        </button>
    </div>

    <div class="max-w-md w-full glass-card rounded-2xl p-6 sm:p-8 shadow-2xl relative z-10">
        
        <div class="flex flex-col items-center text-center mb-6">
            <div class="relative mb-4 group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-full blur opacity-50 group-hover:opacity-100 transition duration-500"></div>
                <img src="assets/avatar.jpeg" alt="Avatar" class="relative w-24 h-24 rounded-full object-cover border-2 border-zinc-800 shadow-xl">
            </div>
            
            <h1 class="text-2xl font-bold tracking-tight text-white">peritti28</h1>
            
            <div class="flex flex-wrap justify-center gap-2 mt-2">
                <span id="badge-dev" class="text-xs bg-emerald-500/10 text-emerald-400 font-medium px-3 py-1 rounded-full border border-emerald-500/20">Programista</span>
                <span id="badge-eng" class="text-xs bg-cyan-500/10 text-cyan-400 font-medium px-3 py-1 rounded-full border border-cyan-500/20">Elektryk Inżynier</span>
            </div>
            
            <p id="desc-text" class="text-sm text-zinc-400 mt-3 leading-relaxed">
                Pasjonat technologii, programowania i elektroniki. Posiadacz rangi HT3 na Crystal PvP w Minecraft.
            </p>
        </div>

        <div class="space-y-3">
            <a href="https://github.com/peritti7" target="_blank" class="btn-hover flex items-center justify-between p-3.5 bg-zinc-900/80 border border-zinc-800 rounded-xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-white font-bold text-sm">GH</div>
                    <span class="font-medium text-zinc-200 text-sm">GitHub</span>
                </div>
                <span class="text-xs text-zinc-500 font-mono">peritti7 &rarr;</span>
            </a>

            <div class="btn-hover flex items-center justify-between p-3.5 bg-zinc-900/80 border border-zinc-800 rounded-xl cursor-default">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-sm">DC</div>
                    <span class="font-medium text-zinc-200 text-sm">Discord</span>
                </div>
                <span class="text-xs text-emerald-400 font-mono bg-emerald-500/10 px-2 py-1 rounded">peritti28</span>
            </div>

            <div class="btn-hover flex items-center justify-between p-3.5 bg-zinc-900/80 border border-zinc-800 rounded-xl cursor-default">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold text-sm">MC</div>
                    <span id="mc-label" class="font-medium text-zinc-200 text-sm">Crystal PvP</span>
                </div>
                <span class="text-xs text-amber-400 font-mono bg-amber-500/10 px-2 py-1 rounded">HT3</span>
            </div>
        </div>

        <div class="text-center mt-6 pt-4 border-t border-zinc-800/80 text-xs text-zinc-500">
            &copy; 2026 peritti28 &bull; js.org
        </div>

    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 1.5 + 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.05)';

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }
        animate();

        const translations = {
            pl: {
                dev: "Programista",
                eng: "Elektryk Inżynier",
                desc: "Pasjonat technologii, programowania i elektroniki. Posiadacz rangi HT3 na Crystal PvP w Minecraft.",
                mc: "Crystal PvP"
            },
            en: {
                dev: "Developer",
                eng: "Electrical Engineer",
                desc: "Passionate about technology, programming and electronics. HT3 rank holder in Minecraft Crystal PvP.",
                mc: "Crystal PvP"
            }
        };

        function setLang(lang) {
            document.getElementById('badge-dev').innerText = translations[lang].dev;
            document.getElementById('badge-eng').innerText = translations[lang].eng;
            document.getElementById('desc-text').innerText = translations[lang].desc;
            document.getElementById('mc-label').innerText = translations[lang].mc;

            if (lang === 'pl') {
                document.getElementById('btn-pl').className = "w-9 h-9 rounded-full overflow-hidden border-2 border-emerald-500 transition shadow-lg focus:outline-none";
                document.getElementById('btn-en').className = "w-9 h-9 rounded-full overflow-hidden border-2 border-zinc-700 opacity-60 hover:opacity-100 transition shadow-lg focus:outline-none";
            } else {
                document.getElementById('btn-en').className = "w-9 h-9 rounded-full overflow-hidden border-2 border-emerald-500 transition shadow-lg focus:outline-none";
                document.getElementById('btn-pl').className = "w-9 h-9 rounded-full overflow-hidden border-2 border-zinc-700 opacity-60 hover:opacity-100 transition shadow-lg focus:outline-none";
            }
        }
    </script>
</body>
</html>
